name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Lua 5.4, Busted, LuaCov, cluacov and bb, so the Lua tests run instead of skipping.
      - run: bash scripts/setup-ubuntu.sh
      - name: Lint
        run: .venv/bin/python -m ruff check
      - name: Guardrails
        run: .venv/bin/python -m pytest -q -p no:cacheprovider tests/test_guardrails.py
      - name: Test suite
        run: .venv/bin/python -m pytest -q -rs
