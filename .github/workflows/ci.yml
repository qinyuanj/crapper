name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Lua 5.4, Busted, LuaCov, cluacov and luacov-reporter-lcov, so the Lua tests
      # run instead of skipping. The script ends by loading lfs, luacov.runner and
      # busted.runner and checking cluacov 1.0.0 in the interpreter it installed: a
      # failed install fails this step and names the missing piece, rather than
      # leaving a suite that is green because every Lua test skipped.
      # -SkipUserEnvironment keeps the runner's profile untouched. The three
      # variables it sets are process-scoped, so they are handed to the later
      # steps through GITHUB_ENV.
      - name: Lua toolchain
        run: |
          & scripts\setup-windows.ps1 -SkipUserEnvironment
          foreach ($name in 'PATH', 'LUA_PATH', 'LUA_CPATH') {
            "$name=$([Environment]::GetEnvironmentVariable($name, 'Process'))" |
              Add-Content -Path $env:GITHUB_ENV -Encoding utf8
          }
      - name: Virtual environment
        run: |
          python -m venv .venv
          & .venv\Scripts\python.exe -m pip install -e ".[dev]"
      - name: Lint
        run: '& .venv\Scripts\python.exe -m ruff check'
      - name: Guardrails
        run: '& .venv\Scripts\python.exe -m pytest -q -p no:cacheprovider tests/test_guardrails.py'
      - name: Test suite
        run: '& .venv\Scripts\python.exe -m pytest -q -rs'
